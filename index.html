<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول – باربر سنترال</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Cairo',sans-serif; background:#0b0d10; color:#f0f2f5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .login-box { background:#1a1e26; border-radius:20px; padding:48px 40px; max-width:420px; width:100%; border:1px solid #2a303c; box-shadow:0 12px 48px rgba(0,0,0,0.6); }
    .login-box .logo { text-align:center; margin-bottom:32px; }
    .login-box .logo i { font-size:3rem; color:#d4a74a; }
    .login-box .logo h1 { font-size:1.6rem; font-weight:900; margin-top:8px; background:linear-gradient(135deg,#d4a74a,#e8c97a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .login-box .logo p { color:#6b7a92; font-size:0.85rem; }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; font-size:0.8rem; font-weight:600; color:#a8b2c8; margin-bottom:4px; }
    .form-group input { width:100%; padding:12px 16px; background:#0b0d10; border:1px solid #2a303c; border-radius:8px; color:#f0f2f5; font-family:inherit; font-size:0.95rem; outline:none; transition:0.25s; }
    .form-group input:focus { border-color:#d4a74a; }
    .btn-login { width:100%; padding:14px; border:none; border-radius:8px; background:#d4a74a; color:#0b0d10; font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; transition:0.25s; margin-top:6px; }
    .btn-login:hover { background:#e8c97a; transform:scale(1.01); }
    .btn-login:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .error-msg { background:rgba(231,76,60,0.12); color:#e74c3c; padding:10px 14px; border-radius:8px; font-size:0.85rem; margin-bottom:16px; display:none; }
    .error-msg.show { display:block; }
    .auth-loading { text-align:center; color:#6b7a92; padding:12px 0; font-size:0.9rem; }
    .auth-loading i { margin-left:8px; }
    .forgot-link, .toggle-mode { display:block; text-align:center; margin-top:14px; font-size:0.85rem; color:#6b7a92; cursor:pointer; transition:0.25s; background:none; border:none; width:100%; font-family:inherit; }
    .forgot-link:hover, .toggle-mode:hover { color:#d4a74a; }
    .hidden { display:none !important; }
    .footer-note { text-align:center; font-size:0.7rem; color:#4a5568; margin-top:24px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo"><i class="fas fa-scissors"></i><h1>باربر سنترال</h1><p>منصة الحلاقين – سوبر أدمن</p></div>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="email" placeholder="admin@example.com" required /></div>
      <div class="form-group"><label>كلمة المرور</label><input type="password" id="password" placeholder="••••••••" required /></div>
      <button type="submit" class="btn-login" id="loginBtn">تسجيل الدخول</button>
    </form>
    <button class="toggle-mode" id="toggleModeBtn">ليس لديك حساب؟ إنشاء حساب جديد</button>
    <form id="signupForm" class="hidden">
      <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="signupEmail" placeholder="example@domain.com" required /></div>
      <div class="form-group"><label>كلمة المرور (6 أحرف على الأقل)</label><input type="password" id="signupPassword" placeholder="••••••••" required minlength="6" /></div>
      <button type="submit" class="btn-login" id="signupBtn">إنشاء حساب</button>
      <button class="toggle-mode" id="backToLoginBtn">عودة إلى تسجيل الدخول</button>
    </form>
    <button class="forgot-link" id="forgotBtn">نسيت كلمة المرور؟</button>
    <div id="loadingIndicator" class="auth-loading hidden"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
    <div class="footer-note">🔐 أي مستخدم مسجل يمكنه الدخول – صلاحية الأدمن تُحدد في لوحة التحكم</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
      }
    }
  </script>

  <script type="module">
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, updateProfile, signOut } from 'firebase/auth';
    import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, limit, serverTimestamp, updateDoc } from 'firebase/firestore';

    // ================================================================
    // 🔑 التكوين الجديد (تم التحديث)
    // ================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyA0IWiY-tI30LX2PS9G2T2gEiBAEd4GqzU",
      authDomain: "salons-feee4.firebaseapp.com",
      projectId: "salons-feee4",
      storageBucket: "salons-feee4.firebasestorage.app",
      messagingSenderId: "601094041409",
      appId: "1:601094041409:web:8cebb62fcc0ac7233cbbc0",
      measurementId: "G-LKCK2L6PMR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ================================================================
    // DOM REFS
    // ================================================================
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginForm = document.getElementById('loginForm');
    const signupEmail = document.getElementById('signupEmail');
    const signupPassword = document.getElementById('signupPassword');
    const signupBtn = document.getElementById('signupBtn');
    const signupForm = document.getElementById('signupForm');
    const toggleModeBtn = document.getElementById('toggleModeBtn');
    const backToLoginBtn = document.getElementById('backToLoginBtn');
    const forgotBtn = document.getElementById('forgotBtn');
    const errorMsg = document.getElementById('errorMsg');
    const loadingIndicator = document.getElementById('loadingIndicator');

    function setLoading(loading) {
      loginBtn.disabled = loading;
      signupBtn.disabled = loading;
      loginBtn.textContent = loading ? 'جاري...' : 'تسجيل الدخول';
      signupBtn.textContent = loading ? 'جاري...' : 'إنشاء حساب';
      loadingIndicator.classList.toggle('hidden', !loading);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
      setTimeout(() => errorMsg.classList.remove('show'), 5000);
    }

    function clearError() {
      errorMsg.classList.remove('show');
      errorMsg.textContent = '';
    }

    // ================================================================
    // FIRESTORE HELPERS
    // ================================================================
    async function isFirstUser() {
      const q = query(collection(db, 'users'), limit(1));
      const snap = await getDocs(q);
      return snap.empty;
    }

    async function createUserDoc(user, role = 'customer') {
      const userRef = doc(db, 'users', user.uid);
      await setDoc(userRef, {
        uid: user.uid,
        name: user.displayName || user.email || 'مستخدم',
        email: user.email || '',
        role: role,
        phone: '',
        photoUrl: user.photoURL || '',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
        lastLoginAt: serverTimestamp()
      }, { merge: true });
    }

    async function updateLastLogin(user) {
      const userRef = doc(db, 'users', user.uid);
      await updateDoc(userRef, { lastLoginAt: serverTimestamp() });
    }

    // ================================================================
    // AUTH FUNCTIONS – الآن تسمح للجميع، لا تسجيل خروج للمستخدمين غير الأدمن
    // ================================================================
    async function handleLogin(email, password) {
      clearError();
      setLoading(true);
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const user = cred.user;
        const userRef = doc(db, 'users', user.uid);
        const userSnap = await getDoc(userRef);

        // إذا لم يكن للمستخدم مستند، أنشئه (مع دور مناسب)
        if (!userSnap.exists()) {
          const first = await isFirstUser();
          const role = first ? 'super_admin' : 'customer';
          await createUserDoc(user, role);
        } else {
          await updateLastLogin(user);
        }

        // ✅ التعديل الجوهري: نوجه جميع المستخدمين إلى dashboard، بغض النظر عن دورهم
        // dashboard سيتولى التحقق من الصلاحية وعرض المحتوى المناسب
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        showError(err.message);
        setLoading(false);
      }
    }

    async function handleSignup(email, password) {
      clearError();
      setLoading(true);
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const user = cred.user;
        await updateProfile(user, { displayName: email.split('@')[0] });
        const first = await isFirstUser();
        const role = first ? 'super_admin' : 'customer';
        await createUserDoc(user, role);
        // ✅ بعد إنشاء الحساب، نوجه المستخدم مباشرة إلى dashboard
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        showError(err.message);
        setLoading(false);
      }
    }

    async function handleForgotPassword(email) {
      clearError();
      if (!email) { showError('أدخل بريدك الإلكتروني أولاً'); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        showError('✅ تم إرسال رابط إعادة التعيين إلى بريدك');
      } catch (err) {
        showError(err.message);
      }
    }

    function toggleMode(mode) {
      if (mode === 'signup') {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        forgotBtn.classList.add('hidden');
        toggleModeBtn.textContent = 'لديك حساب؟ تسجيل الدخول';
        signupEmail.value = emailInput.value;
        signupPassword.value = '';
      } else {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        forgotBtn.classList.remove('hidden');
        toggleModeBtn.textContent = 'ليس لديك حساب؟ إنشاء حساب جديد';
        emailInput.value = signupEmail.value;
        passwordInput.value = '';
      }
      clearError();
    }

    // ================================================================
    // EVENT LISTENERS
    // ================================================================
    toggleModeBtn.addEventListener('click', () => {
      toggleMode(loginForm.classList.contains('hidden') ? 'login' : 'signup');
    });
    backToLoginBtn.addEventListener('click', () => toggleMode('login'));

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) { showError('يرجى إدخال البريد وكلمة المرور'); return; }
      handleLogin(email, password);
    });

    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = signupEmail.value.trim();
      const password = signupPassword.value;
      if (!email || !password) { showError('يرجى إدخال البريد وكلمة المرور'); return; }
      if (password.length < 6) { showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل'); return; }
      handleSignup(email, password);
    });

    forgotBtn.addEventListener('click', () => {
      const email = emailInput.value.trim();
      handleForgotPassword(email);
    });

    // ================================================================
    // إذا كان المستخدم مسجلاً بالفعل، نوجهه إلى dashboard (أيضاً للجميع)
    // ================================================================
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // نوجه أي مستخدم مسجل إلى dashboard
        window.location.href = '/admin/dashboard.html';
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') clearError();
    });

    console.log('✅ صفحة تسجيل الدخول – تسمح للجميع بالدخول إلى dashboard');
  </script>
</body>
</html>
